<header class="bar">
  <div class="inner">
    <div class="top">
      <a class="brand" href="/" aria-label="Radar RD, inicio">
        <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2" />
          <circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2" opacity=".6" />
          <path d="M12 12 L19 6" stroke="var(--amber)" stroke-width="2.4" stroke-linecap="round" />
        </svg>
        <span>Radar RD</span>
      </a>
      <button
        class="toggle"
        type="button"
        aria-controls="buscador"
        [attr.aria-expanded]="abierto()"
        (click)="abierto.set(!abierto())"
      >
        Buscar vuelo
      </button>
    </div>

    <form id="buscador" class="search" [class.open]="abierto()" [formGroup]="form" (ngSubmit)="enviar()" novalidate>
      <div class="field f-aerolinea">
        <label for="aerolinea">Aerolínea</label>
        <select id="aerolinea" formControlName="aerolinea">
          <option value="todas">Todas</option>
          <option value="DM">Arajet (DM)</option>
        </select>
      </div>

      <div class="field f-numero">
        <label for="numero">Número de vuelo</label>
        <input
          id="numero"
          type="text"
          formControlName="numero"
          placeholder="DM201"
          autocomplete="off"
          [attr.aria-invalid]="invalido('numero')"
        />
      </div>

      <div class="field f-ap">
        <label for="origen">Origen</label>
        <input
          id="origen"
          type="text"
          formControlName="origen"
          placeholder="SDQ"
          maxlength="3"
          list="aeropuertos"
          autocomplete="off"
          [attr.aria-invalid]="invalido('origen')"
        />
      </div>

      <button class="swap" type="button" (click)="intercambiar()" aria-label="Intercambiar origen y destino">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 7h11m0 0-3-3m3 3-3 3M17 17H6m0 0 3-3m-3 3 3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>

      <div class="field f-ap">
        <label for="destino">Destino</label>
        <input
          id="destino"
          type="text"
          formControlName="destino"
          placeholder="MIA"
          maxlength="3"
          list="aeropuertos"
          autocomplete="off"
          [attr.aria-invalid]="invalido('destino')"
        />
      </div>

      <div class="field f-fecha">
        <label for="fecha">Fecha</label>
        <input id="fecha" type="date" formControlName="fecha" />
      </div>

      <div class="actions">
        <button class="primary" type="submit">Rastrear</button>
        <button class="ghost" type="button" (click)="limpiar()">Limpiar</button>
      </div>

      @if (error(); as msg) {
        <p class="error" role="alert">{{ msg }}</p>
      }

      <datalist id="aeropuertos">
        @for (a of aeropuertos; track a.codigo) {
          <option [value]="a.codigo">{{ a.ciudad }}</option>
        }
      </datalist>
    </form>
  </div>

  <svg class="plane" viewBox="0 0 96 40" aria-hidden="true" focusable="false">
    <path d="M44 24 L33 38 H46 L63 26Z" fill="#c4d3e0" stroke="#0b2a45" stroke-width="1.5" stroke-linejoin="round" />
    <ellipse cx="53" cy="31" rx="7" ry="3.4" fill="#9fb3c6" stroke="#0b2a45" stroke-width="1.2" />
    <path d="M8 20 L4 5 H15 L27 16Z" fill="#ffb703" stroke="#0b2a45" stroke-width="1.5" stroke-linejoin="round" />
    <path d="M6 22 C6 16 14 14 26 14 H70 C82 14 92 18 94 22 C92 26 82 28 70 28 H26 C14 28 6 28 6 22Z" fill="#ffffff" stroke="#0b2a45" stroke-width="1.5" />
    <path d="M7 24.5 H92" stroke="#2ec4b6" stroke-width="2" stroke-linecap="round" />
    <path d="M79 17 L88 19.5 L86 21.5 H78Z" fill="#0b2a45" />
    <g fill="#0b2a45">
      <circle cx="30" cy="20" r="1.6" /><circle cx="37" cy="20" r="1.6" />
      <circle cx="44" cy="20" r="1.6" /><circle cx="51" cy="20" r="1.6" />
      <circle cx="58" cy="20" r="1.6" /><circle cx="65" cy="20" r="1.6" />
    </g>
  </svg>
</header>

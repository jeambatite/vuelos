<div class="globe">
  <div
    #stage
    class="stage"
    role="img"
    aria-label="Globo terráqueo en 3D girando, con rutas de vuelo desde República Dominicana"
  ></div>

  @if (fallo()) {
    <p class="fallback">No se pudo iniciar el globo 3D en este navegador.</p>
  }

  <p class="caption">
    <strong>{{ flights().length }} {{ flights().length === 1 ? 'vuelo' : 'vuelos' }} en vivo</strong>
    <small>
      Fuente: {{ fuente() }}@if (simulado()) {
        (datos simulados)
      }. Arrastra para girarlo.
    </small>
    @if (error(); as aviso) {
      <small class="aviso">{{ aviso }}</small>
    }
  </p>

  <button class="toggle" type="button" (click)="alternar()">
    {{ girando() ? 'Pausar giro' : 'Girar' }}
  </button>
</div>

name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una sola publicación a la vez; si llega otra, se cancela la anterior.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pruebas
        run: npm test -- --watch=false

      # La página vive en https://<usuario>.github.io/<repositorio>/, por eso el base-href.
      - name: Compilar
        run: npx ng build --base-href "/${{ github.event.repository.name }}/"

      # Copia de index.html como 404.html por si más adelante se agregan rutas.
      - name: Preparar sitio
        run: |
          cp dist/vuelos/browser/index.html dist/vuelos/browser/404.html
          touch dist/vuelos/browser/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/vuelos/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
